name: custom-renderer

# Typecheck, lint, format check, tests and build of the custom tree renderer (spikes/custom). The harness files in spikes/shared are
# compiled into it, the Parquet reader is typechecked through it and the regression test reads data/synthetic, so those trigger the job as well.
on:
  push:
    paths:
      - 'spikes/custom/**'
      - 'spikes/shared/**'
      - 'spikes/parquet-experiment/web/**'
      - 'data/synthetic/**'
      - '.github/workflows/custom-renderer.yml'
  pull_request:
    paths:
      - 'spikes/custom/**'
      - 'spikes/shared/**'
      - 'spikes/parquet-experiment/web/**'
      - 'data/synthetic/**'
      - '.github/workflows/custom-renderer.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/custom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/custom/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
