<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@canopy/viewer without a framework</title>
  </head>
  <body>
    <header class="bar">
      <strong>@canopy/viewer</strong>
      <span class="muted">no framework: controls, events, a custom popup and a custom column</span>
      <span class="spacer"></span>
      <label><input type="checkbox" id="show-controls" checked /> Controls</label>
      <label><input type="checkbox" id="dark" /> Dark</label>
      <label>Colour by <select id="colour-by"><option value="">none</option><option value="country_code">country</option></select></label>
      <span id="layout-slot"></span>
    </header>
    <main>
      <div id="tree" class="tree"></div>
      <aside>
        <section id="legend-slot" hidden>
          <h2></h2>
          <ul></ul>
        </section>
        <h2>Events</h2>
        <ol id="log" aria-live="polite"></ol>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
